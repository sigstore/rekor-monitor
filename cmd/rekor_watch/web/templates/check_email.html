<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Rekor Watch</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1><a href="/" class="header-link">Rekor Watch</a></h1>
        <p class="tagline">Monitor Rekor transparency logs for identity matches</p>
    </header>

    <main>
        <section class="auth-section">
            <h2>Check Your Email</h2>
            <p>We've sent you a magic link. Click the link in the email and confirm to sign in.</p>
            <p class="text-muted">The link expires in 15 minutes. This page will update automatically.</p>
        </section>
    </main>

    <footer>
        <p>Powered by <a href="https://sigstore.dev" target="_blank" rel="noopener">Sigstore</a></p>
    </footer>

    <script>
    (function() {
        var timeout = setTimeout(function() {
            clearInterval(interval);
        }, 15 * 60 * 1000);
        var interval = setInterval(function() {
            fetch("/auth/poll").then(function(resp) {
                return resp.json();
            }).then(function(data) {
                if (data.authenticated) {
                    clearTimeout(timeout);
                    clearInterval(interval);
                    window.location.href = "/dashboard";
                }
            }).catch(function() {});
        }, 2000);
    })();
    </script>
</body>
</html>
